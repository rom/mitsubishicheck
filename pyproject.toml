[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsubishicheck"
version = "1.0.0"
description = "Security audit tool for Mitsubishi PLCs using MELSEC protocol"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Security Research Team", email = "security@example.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Networking",
]
keywords = ["plc", "mitsubishi", "melsec", "security", "audit", "ics", "scada"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mitsubishicheck = "mitsubishicheck.cli:main"

[project.urls]
Homepage = "https://github.com/example/mitsubishicheck"
Documentation = "https://github.com/example/mitsubishicheck/docs"
Repository = "https://github.com/example/mitsubishicheck"
Issues = "https://github.com/example/mitsubishicheck/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mitsubishicheck*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
